<!doctype html><html lang="it"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
:root{--orange:#e2683c;--cream:#f3ebde;--dark:#121014}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:var(--dark);overflow:hidden;position:relative;font-family:'Archivo Black',sans-serif;color:#fff}
.bold{font-family:'Archivo Black';text-transform:uppercase;letter-spacing:-3px;line-height:.95}
.serif{font-family:'Instrument Serif';font-style:italic}
.mono{font-family:'JetBrains Mono';font-weight:700}
.c{position:absolute;left:0;right:0;text-align:center}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.55))}
.card{width:420px;height:560px;border-radius:34px;position:absolute;padding:38px;display:flex;flex-direction:column;justify-content:space-between}
</style></head><body>
<div class="c mono" style="top:300px;font-size:30px;letter-spacing:6px;color:#bdb3a6">LO SAPEVI? · TE LO SPIEGA <span style="color:var(--orange)">CLAUDIO</span></div>
<div class="c bold" style="top:380px;font-size:150px">DOPPIO</div>
<div class="c bold" style="top:520px;font-size:150px;color:var(--orange)">APPUNTA-</div>
<div class="c bold" style="top:660px;font-size:150px;color:var(--orange)">MENTO?</div>
<div class="card" style="left:90px;top:860px;background:#1f1c22;border:4px solid #3a3540;transform:rotate(-4deg)">
 <div class="mono" style="font-size:28px;color:#bdb3a6;letter-spacing:3px">ORE 13:00</div>
 <div><div class="bold" style="font-size:70px">PARTE 1</div><div class="serif" style="font-size:46px;color:#bdb3a6;margin-top:10px">cosa è successo</div></div>
 <div style="font-size:90px">☀️</div></div>
<div class="card" style="left:570px;top:900px;background:var(--orange);transform:rotate(4deg)">
 <div class="mono" style="font-size:28px;color:#121014;letter-spacing:3px">ORE 20:00</div>
 <div><div class="bold" style="font-size:70px;color:#121014">PARTE 2</div><div class="serif" style="font-size:46px;color:#121014;margin-top:10px">perché ti riguarda</div></div>
 <div style="font-size:90px">🌙</div></div>
<div class="c serif" style="top:1520px;font-size:58px;color:var(--cream)">la storia completa <span style="color:var(--orange)">nello stesso giorno</span></div>
<div class="c mono" style="top:1610px;font-size:30px;color:#8a8590;letter-spacing:2px">rispondi al sondaggio qui sotto ↓</div>
<div class="vig"></div>
</body></html>
