<!doctype html>
<html lang="it"><head><meta charset="utf-8">

<script src="durs1.js"></script>
<script>window.ORDER=['I','A','B','C','D','E','F','H'];</script>
<script src="hook.js"></script>
<script src="engine.js"></script>
</head><body><div id="stage">

<!-- A · two postcards -->
<div class="scene" id="A" style="background:#121014">
 <div class="abs mono" id="Ak" style="top:290px;font-size:28px;letter-spacing:4px;color:#bdb3a6">DARIO AMODEI · LE ORIGINI</div>
 <svg id="Av" width="1080" height="1080" style="position:absolute;left:0;top:350px"></svg>
</div>

<!-- B · chalkboard -->
<div class="scene" id="B" style="background:#2a1d14">
 <svg id="Bv" width="1080" height="1100" style="position:absolute;left:0;top:320px"></svg>
</div>

<!-- C · ID badges -->
<div class="scene" id="C" style="background:#0d1022">
 <div class="abs mono" id="Ck" style="top:290px;font-size:28px;letter-spacing:4px;color:#8fa3c0">VERSO L'INTELLIGENZA ARTIFICIALE</div>
 <svg id="Cv" width="1080" height="1080" style="position:absolute;left:0;top:350px"></svg>
</div>

<!-- D · door -->
<div class="scene" id="D" style="background:#f4f0e8">
 <svg id="Dv" width="1080" height="1120" style="position:absolute;left:0;top:300px"></svg>
</div>

<!-- E · contract with red lines -->
<div class="scene" id="E" style="background:#121014">
 <div class="abs mono" id="Ek" style="top:290px;font-size:28px;letter-spacing:4px;color:#bdb3a6">2026 · ANTHROPIC E PENTAGONO</div>
 <svg id="Ev" width="1080" height="1100" style="position:absolute;left:0;top:340px"></svg>
</div>

<!-- F · LED board -->
<div class="scene" id="F" style="background:#050608">
 <svg id="Fv" width="1080" height="1100" style="position:absolute;left:0;top:300px"></svg>
 <div class="abs mono" id="Fd" style="top:1400px;font-size:24px;color:#6e6873">Non è consulenza finanziaria.</div>
</div>

<!-- H · teaser -->
<div class="scene" id="H" style="background:#0d1022">
 <svg id="Hv" width="1080" height="420" style="position:absolute;left:0;top:300px"></svg>
 <div class="abs bold" id="Ha" style="top:760px;font-size:112px;color:#fff;line-height:1">COSA CAMBIA<br><span style="color:#e2683c">PER TE?</span></div>
 <div class="abs bold" id="Hb" style="top:1060px;font-size:64px;color:#0d1022;background:#f3ebde;padding:14px 30px 8px;border-radius:12px;letter-spacing:0">PARTE 2 →</div>
</div>

<div class="grain"></div><div class="vig"></div>
</div>
<script>
const MONO='font-family="JetBrains Mono" font-weight="700"',ARCH='font-family="Archivo Black"',SER='font-family="Instrument Serif" font-style="italic"';
function postcard(x,y,r,k,inner,title,c){if(k<=0)return '';const e=eback(k);return `<g transform="translate(${x} ${y}) rotate(${r*(2-e)}) scale(${.4+.6*e})" opacity="${cl(k*3)}">
 <rect x="-210" y="-160" width="420" height="320" rx="10" fill="#f3ebde"/><rect x="-190" y="-140" width="380" height="220" fill="${c}"/>${inner}
 <text y="128" text-anchor="middle" ${ARCH} font-size="38" fill="#141215">${title}</text></g>`}
R.A=(t,d)=>{ap($('Ak'),t,.1,.3,10);let h='';
 const sf=`<rect x="-190" y="20" width="380" height="60" fill="#26405f"/><path d="M-170 20 V-90 M120 20 V-90" stroke="#c94f2a" stroke-width="12"/><path d="M-190 -60 Q-25 30 120 -80 Q160 -20 190 -10" stroke="#c94f2a" stroke-width="5" fill="none"/><line x1="-190" y1="10" x2="190" y2="10" stroke="#c94f2a" stroke-width="10"/>`;
 const tu=`<path d="M-190 80 V0 Q-100 -70 0 -10 Q90 -80 190 -20 V80 Z" fill="#7a9a4a"/><path d="M-190 80 V40 Q-60 -10 60 40 Q130 10 190 30 V80Z" fill="#5c7d36"/><g fill="#2f4a22"><path d="M-110 30 q12 -90 24 0 z"/><path d="M-70 40 q10 -70 20 0 z"/><path d="M130 20 q12 -80 24 0 z"/></g><circle cx="120" cy="-90" r="26" fill="#f2c14e"/>`;
 h+=postcard(300,330,-6,P(t,.5,1.0),sf,'SAN FRANCISCO','#e9b48a');
 h+=postcard(760,700,5,P(t,4.0,4.5),tu,'TOSCANA','#cfe1ef');
 const k=P(t,4.6,5.6);if(k>0){h+=`<path id="Aarc" d="M760 520 Q 640 330 460 360" stroke="#f3ebde" stroke-width="5" stroke-dasharray="14 12" fill="none" opacity="${k}"/>`;
  h+=`<text x="560" y="300" ${SER} font-size="44" fill="#f3ebde" opacity="${k}">padre italiano</text>`}
 const ky=eback(P(t,2.2,2.6));if(ky>0)h+=`<g transform="translate(260 760) scale(${ky})"><text text-anchor="middle" ${ARCH} font-size="170" fill="#e2683c">1983</text></g>`;
 $('Av').innerHTML=h;};

R.B=(t,d)=>{let h=`<rect x="60" y="20" width="960" height="1000" rx="20" fill="#7a5532"/><rect x="90" y="50" width="900" height="940" rx="8" fill="#1f3a2e"/>`;
 h+=`<text x="540" y="170" text-anchor="middle" ${ARCH} font-size="78" fill="#e9efe6" opacity="${P(t,.4,.8)}">FISICA</text>`;
 h+=`<text x="540" y="260" text-anchor="middle" ${SER} font-size="52" fill="#cfd8cc" opacity="${P(t,.9,1.3)}">F = ma · E = mc²</text>`;
 h+=`<text x="540" y="380" text-anchor="middle" ${ARCH} font-size="62" fill="#f2c14e" opacity="${P(t,2.2,2.6)}">PhD · PRINCETON</text><text x="540" y="440" text-anchor="middle" ${MONO} font-size="34" fill="#e9efe6" opacity="${P(t,2.6,3.0)}">BIOFISICA</text>`;
 // neurons drawn in chalk
 const k=P(t,3.6,5.8);const NS=[[300,640],[540,600],[780,660],[420,820],[680,840]];
 [[0,1],[1,2],[0,3],[1,3],[1,4],[2,4],[3,4]].forEach(([a,b],i)=>{const kk=cl(k*7-i);if(kk<=0)return;const [x1,y1]=NS[a],[x2,y2]=NS[b];
  h+=`<line x1="${x1}" y1="${y1}" x2="${x1+(x2-x1)*kk}" y2="${y1+(y2-y1)*kk}" stroke="#e9efe6" stroke-width="5" stroke-linecap="round" opacity=".75"/>`});
 NS.forEach(([x,y],i)=>{const kk=eback(P(t,3.6+i*.15,4.0+i*.15));if(kk>0)h+=`<circle cx="${x}" cy="${y}" r="${30*kk}" fill="none" stroke="#e9efe6" stroke-width="6"/><circle cx="${x}" cy="${y}" r="${10*kk}" fill="#f2c14e"/>`});
 h+=`<text x="540" y="950" text-anchor="middle" ${SER} font-size="46" fill="#cfd8cc" opacity="${P(t,4.6,5.0)}">come funzionano le reti di neuroni</text>`;
 h+=`<rect x="700" y="1000" width="120" height="16" rx="6" fill="#f3ebde"/>`;$('Bv').innerHTML=h;};

const BADGES=[['BAIDU','2014','#c94f2a','',3.0],['GOOGLE BRAIN','2015','#26405f','',4.2],['OPENAI','2016','#141215','VP RESEARCH',5.6]];
R.C=(t,d)=>{ap($('Ck'),t,.1,.3,10);let h='';
 BADGES.forEach(([n,y,c,sub,t0],i)=>{const k=P(t,t0,t0+.5);if(k<=0)return;const e=eback(k);const x=200+i*340,yy=330+i*40;
  h+=`<g transform="translate(${x} ${yy}) rotate(${(i-1)*5}) translate(0 ${(1-e)*-300})" opacity="${cl(k*3)}">
   <line x1="0" y1="-330" x2="0" y2="-170" stroke="#8fa3c0" stroke-width="8"/>
   <rect x="-140" y="-180" width="280" height="400" rx="24" fill="#f3ebde"/><rect x="-140" y="-180" width="280" height="90" rx="24" fill="${c}"/><rect x="-140" y="-120" width="280" height="30" fill="${c}"/>
   <rect x="-30" y="-165" width="60" height="16" rx="8" fill="#0d1022"/>
   <circle cx="0" cy="-10" r="56" fill="#c9c0b2"/><path d="M-80 120 Q0 30 80 120" fill="#c9c0b2"/>
   <text y="${n.length>8?168:170}" text-anchor="middle" ${ARCH} font-size="${n.length>8?32:44}" fill="#141215">${n}</text><text y="206" text-anchor="middle" ${MONO} font-size="28" fill="#5a4a3a">${y}</text></g>`;});
 const kv=eback(P(t,7.0,7.4));if(kv>0)h+=`<g transform="translate(880 720) rotate(-6) scale(${kv})"><rect x="-150" y="-40" width="300" height="80" rx="14" fill="#f2c14e"/><text y="14" text-anchor="middle" ${MONO} font-size="32" fill="#141215">VICEPRESIDENTE</text></g><text x="880" y="810" text-anchor="middle" ${MONO} font-size="26" fill="#f2c14e" opacity="${kv}">DELLA RICERCA</text>`;
 const kg=P(t,8.6,9.0);h+=`<g opacity="${kg}"><rect x="190" y="880" width="700" height="110" rx="55" fill="none" stroke="#f3ebde" stroke-width="4"/><text x="540" y="952" text-anchor="middle" ${ARCH} font-size="54" fill="#f3ebde">GPT-2 · GPT-3</text></g>`;
 $('Cv').innerHTML=h;};

R.D=(t,d)=>{let h='';const o=eio(P(t,3.6,4.8));
 h+=`<text x="540" y="40" text-anchor="middle" ${MONO} font-size="30" fill="#8a7a6c" opacity="${P(t,.3,.6)}">FINE 2020 · LASCIA OPENAI CON ALTRI COLLEGHI</text>`;
 // door frame
 h+=`<rect x="330" y="110" width="420" height="620" fill="#141215"/>`;
 h+=`<rect x="330" y="110" width="420" height="620" fill="url(#lg)" opacity="${o}"/><defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f2c14e"/><stop offset="1" stop-color="#e2683c"/></linearGradient></defs>`;
 h+=`<path d="M330 110 L${330+420*(1-o*.75)} ${110+60*o} L${330+420*(1-o*.75)} ${730-60*o} L330 730 Z" fill="#c94f2a" stroke="#141215" stroke-width="4"/>`;
 h+=`<rect x="310" y="90" width="460" height="660" fill="none" stroke="#5a4a3a" stroke-width="20"/>`;
 // people dots walking in
 for(let i=0;i<7;i++){const k=eo(P(t,1.0+i*.12,2.6+i*.12));const x=170+i*50+(540-170-i*50)*k*(o>.5?1:.6);const hl=(i===0||i===1);
  h+=`<g transform="translate(${x} ${660})" opacity="${P(t,.8,1.1)}"><circle cy="-50" r="20" fill="${hl?'#c94f2a':'#5a4a3a'}"/><rect x="-18" y="-28" width="36" height="60" rx="16" fill="${hl?'#c94f2a':'#5a4a3a'}"/></g>`}
 const ka=eback(P(t,4.0,4.5));if(ka>0)h+=`<g transform="translate(540 320) scale(${ka})"><text text-anchor="middle" ${ARCH} font-size="70" fill="#141215">2021</text><text y="80" text-anchor="middle" ${ARCH} font-size="62" fill="#141215">ANTHROPIC</text></g>`;
 const kd=P(t,5.4,5.9);h+=`<g opacity="${kd}"><text x="540" y="840" text-anchor="middle" ${ARCH} font-size="46" fill="#141215">DARIO · AMMINISTRATORE DELEGATO</text><text x="540" y="900" text-anchor="middle" ${ARCH} font-size="46" fill="#c94f2a">DANIELA · PRESIDENTE</text><text x="540" y="950" text-anchor="middle" ${SER} font-size="40" fill="#5a4a3a">con altri ex colleghi di OpenAI</text></g>`;
 const kc=eback(P(t,8.6,9.1));if(kc>0)h+=`<g transform="translate(540 1050) scale(${kc})"><rect x="-360" y="-50" width="720" height="90" rx="45" fill="#141215"/><text y="12" text-anchor="middle" ${MONO} font-size="34" fill="#f3ebde">l'azienda che sviluppa Claude</text></g>`;
 $('Dv').innerHTML=h;};

R.E=(t,d)=>{ap($('Ek'),t,.1,.3,10);let h=`<g transform="rotate(-2 540 450)"><rect x="140" y="20" width="800" height="820" rx="10" fill="#f3ebde"/>
 <text x="200" y="100" ${ARCH} font-size="40" fill="#141215">CONTRATTO · USO DI CLAUDE</text>`;
 for(let i=0;i<4;i++)h+=`<rect x="200" y="${150+i*44}" width="${560-((i*97)%180)}" height="14" rx="7" fill="#cfc4b2"/>`;
 [['NO alla sorveglianza di massa',3.2,390],['NO alle armi completamente autonome',5.8,540]].forEach(([s,t0,y])=>{const k=P(t,t0,t0+.4);
  h+=`<g opacity="${cl(k*3)}"><text x="200" y="${y}" ${ARCH} font-size="${s.length>30?31:38}" fill="#141215">${s}</text></g><line x1="195" y1="${y+22}" x2="${195+690*eio(P(t,t0+.3,t0+.9))}" y2="${y+22}" stroke="#d62f2f" stroke-width="10" stroke-linecap="round"/>`});
 for(let i=0;i<3;i++)h+=`<rect x="200" y="${640+i*44}" width="${520-((i*61)%140)}" height="14" rx="7" fill="#cfc4b2"/>`;
 h+='</g>';
 const kg=eback(P(t,8.6,9.1));if(kg>0)h+=`<g transform="translate(700 860) rotate(-8) scale(${kg})"><rect x="-300" y="-80" width="600" height="160" rx="16" fill="#121014" stroke="#3ccf6e" stroke-width="8"/>
  <text y="-12" text-anchor="middle" ${ARCH} font-size="44" fill="#3ccf6e">GIUDICE FEDERALE</text><text y="44" text-anchor="middle" ${MONO} font-size="30" fill="#3ccf6e">MISURE BLOCCATE · 26/3</text></g>`;
 h+=`<text x="540" y="1060" text-anchor="middle" ${SER} font-size="50" fill="#f3ebde" opacity="${P(t,11.2,11.6)}">la vicenda legale non è chiusa</text>`;
 $('Ev').innerHTML=h;};

function led(txt,x,y,c,sz){return `<text x="${x}" y="${y}" ${MONO} font-size="${sz}" fill="${c}" style="filter:drop-shadow(0 0 10px ${c})">${txt}</text>`}
R.F=(t,d)=>{let h=`<rect x="80" y="20" width="920" height="760" rx="18" fill="#0c0f12" stroke="#2a2f36" stroke-width="6"/>`;
 for(let y=40;y<780;y+=14)h+=`<line x1="90" y1="${y}" x2="990" y2="${y}" stroke="#12161a" stroke-width="2"/>`;
 h+=led('ANT',130,130,'#f2c14e',80)+led('NASDAQ · 19/11/2026',420,118,'#8a8f96',32);
 const rows=[['PREZZO IPO','83,00 $','#f3ebde',2.6],['APERTURA','111,50 $','#3ccf6e',3.6],['CHIUSURA','97,17 $','#3ccf6e',4.4]];
 rows.forEach(([a,v,c,t0],i)=>{if(t<t0)return;const n=Math.floor(cl((t-t0)/.5)*v.length);const y=270+i*150;
  h+=led(a,130,y,'#8a8f96',40)+led(v.slice(0,n)+(n<v.length?'█':''),950-v.length*48,y,c,80)});
 const kr=eback(P(t,4.9,5.4));if(kr>0)h+=`<g transform="translate(540 890) scale(${kr})"><rect x="-400" y="-70" width="800" height="130" rx="20" fill="#f2c14e"/><text y="22" text-anchor="middle" ${ARCH} font-size="62" fill="#050608">81,3 MLD $ RACCOLTI</text></g>`;
 h+=`<text x="540" y="1060" text-anchor="middle" ${SER} font-size="50" fill="#f3ebde" opacity="${P(t,6.6,7.0)}">la più grande quotazione della storia</text>`;
 $('Fv').innerHTML=h;ap($('Fd'),t,6.0,.4,10);};

R.H=(t,d)=>{let h='';for(let i=0;i<3;i++){const k=eback(P(t,.1+i*.15,.5+i*.15));h+=`<circle cx="${400+i*140}" cy="220" r="${40*k}" fill="#e2683c" opacity="${.5+.5*Math.abs(Math.sin(t*4+i))}"/>`}
 h=`<rect x="250" y="80" width="580" height="280" rx="60" fill="#14223a" opacity="${P(t,0,.2)}"/><path d="M380 360 L340 420 L450 360 Z" fill="#14223a" opacity="${P(t,0,.2)}"/>`+h;
 $('Hv').innerHTML=h;pop($('Ha'),t,.3,.45);pop($('Hb'),t,1.9,.4,-6,-2);};
</script></body></html>
