<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="durs1.js"></script>
<script>window.ORDER=['I','A','B','C','D','H'];</script>
<script src="engine.js"></script>
</head><body><div id="stage">

<!-- A+B · rocket up and back -->
<div class="scene" id="A" style="background:#0d1022">
 <div class="abs mono" id="Ak" style="top:300px;font-size:28px;letter-spacing:4px;color:#8fa3c0">ANTHROPIC · 19 NOVEMBRE</div>
 <svg id="Ar" width="1080" height="1000" style="position:absolute;left:0;top:380px"></svg>
</div>
<div class="scene" id="B" style="background:#0d1022">
 <div class="abs mono" id="Bk" style="top:300px;font-size:28px;letter-spacing:4px;color:#8fa3c0">ANTHROPIC · 20 NOVEMBRE</div>
 <svg id="Br" width="1080" height="1000" style="position:absolute;left:0;top:380px"></svg>
</div>

<!-- C · SpaceX path -->
<div class="scene" id="C" style="background:#0b0b0e">
 <div class="abs bold" id="Ca" style="top:300px;font-size:110px;color:#fff">SPACEX</div>
 <svg id="Cc" width="1080" height="820" style="position:absolute;left:0;top:450px"></svg>
</div>

<!-- D · who really gains -->
<div class="scene" id="D" style="background:#f4f0e8">
 <div class="abs bold" id="Da" style="top:290px;font-size:84px;color:#141215;line-height:1">CHI HA GUADAGNATO<br><span style="color:#c94f2a">DAVVERO?</span></div>
 <div class="abs" id="D1" style="top:540px"><div style="width:860px;background:#26405f;border-radius:24px;padding:30px 36px;text-align:left;display:flex;gap:26px;align-items:center">
  <div style="font-size:90px">🏦</div><div><div class="mono" style="font-size:28px;color:#c9d6ea;letter-spacing:2px">AL PREZZO DI QUOTAZIONE</div>
  <div class="sans" style="font-size:44px;font-weight:800;color:#fff">grandi investitori → il "botto"</div></div></div></div>
 <div class="abs" id="D2" style="top:820px"><div style="width:860px;background:#fff;border:4px solid #141215;border-radius:24px;padding:30px 36px;text-align:left;display:flex;gap:26px;align-items:center">
  <div style="font-size:90px">🧍</div><div><div class="mono" style="font-size:28px;color:#8a7a6c;letter-spacing:2px">DOPO, IN BORSA</div>
  <div class="sans" style="font-size:44px;font-weight:800;color:#141215">il piccolo risparmiatore</div>
  <div class="sans" style="font-size:34px;color:#c94f2a;font-weight:700">a prezzi già saliti</div></div></div></div>
 <div class="abs mono" id="Dd" style="top:1140px;font-size:24px;color:#8a7a6c">Non è consulenza finanziaria.</div>
</div>

<!-- H · teaser -->
<div class="scene" id="H" style="background:#0d1022">
 <div class="abs bold" id="Ha" style="top:600px;font-size:150px;color:#fff;line-height:1">45 ANNI<br><span style="color:#f2c14e">DI DATI</span></div>
 <div class="abs bold" id="Hb" style="top:960px;font-size:64px;color:#0d1022;background:#f3ebde;padding:14px 30px 8px;border-radius:12px;letter-spacing:0">PARTE 2 →</div>
</div>

<div class="grain"></div><div class="vig"></div>
</div>
<script>
const Yp=v=>860-(v-80)*14;
function rocket(x,y,ang,flame){return `<g transform="translate(${x} ${y}) rotate(${ang})">${flame?`<path d="M-16 60 Q0 ${110+Math.random()*0} 16 60 Z" fill="#ff9a3c"/><path d="M-9 60 Q0 90 9 60 Z" fill="#ffe08a"/>`:''}
 <path d="M0 -70 C30 -40 30 20 24 60 H-24 C-30 20 -30 -40 0 -70 Z" fill="#f3ebde"/><circle cx="0" cy="-10" r="12" fill="#26405f"/>
 <path d="M-24 30 L-46 70 H-24 Z M24 30 L46 70 H24 Z" fill="#e2683c"/></g>`}
function axis(h){return h+`<line x1="120" y1="${Yp(83)}" x2="960" y2="${Yp(83)}" stroke="#8fa3c0" stroke-dasharray="12 10" stroke-width="3"/>
 <text x="130" y="${Yp(83)+50}" font-family="JetBrains Mono" font-weight="700" font-size="32" fill="#8fa3c0">PREZZO IPO · 83 $</text>`}
R.A=(t,d)=>{ap($('Ak'),t,.1,.3,10);const k=eio(P(t,.8,3.6));const v=83+28.5*k;let h=axis('');
 h+=rocket(540,Yp(v)-70,0,k>0&&k<1);
 if(t>.5)h+=`<text x="540" y="${Yp(v)-190}" text-anchor="middle" font-family="Archivo Black" font-size="${k>=1?110:84}" fill="${k>=1?'#3ccf6e':'#fff'}">$${fmt(v,2)}</text>`;
 if(k>=1)h+=`<text x="540" y="${Yp(v)-320}" text-anchor="middle" font-family="Archivo Black" font-size="76" fill="#3ccf6e" opacity="${P(t,3.7,4.1)}">+34% IN POCHI MINUTI</text>`;
 $('Ar').innerHTML=h;};
R.B=(t,d)=>{ap($('Bk'),t,.1,.3,10);const k=eio(P(t,.5,4.0));const v=111.5-28.45*k;let h=axis('');
 h+=rocket(540,Yp(v)-70,k>0&&k<1?180:k>=1?0:0,false);
 h+=`<text x="540" y="${Yp(v)-190}" text-anchor="middle" font-family="Archivo Black" font-size="96" fill="${k>=1?'#ff5a5a':'#fff'}">$${fmt(v,2)}</text>`;
 if(k>=1)h+=`<g opacity="${P(t,4.3,4.7)}"><rect x="200" y="${Yp(83)+80}" width="680" height="80" rx="16" fill="#f2c14e"/><text x="540" y="${Yp(83)+133}" text-anchor="middle" font-family="Archivo Black" font-size="38" fill="#0d1022">+5 CENTESIMI DALL'IPO</text></g>`;
 $('Br').innerHTML=h;};
R.C=(t,d)=>{pop($('Ca'),t,.2,.4);const sv=$('Cc');const Y=v=>620-(v-110)*9;const X=[200,540,880];const P3=[[135,'giugno · IPO','135 $',1.0],[160.95,'primo giorno','161 $',3.2],[127.8,'20 novembre','sotto 135 $',6.2]];let h='';
 h+=`<line x1="120" y1="${Y(135)}" x2="960" y2="${Y(135)}" stroke="#4a4541" stroke-dasharray="12 10" stroke-width="3"/>`;
 for(let i=1;i<3;i++){const k=eio(P(t,P3[i][3]-.6,P3[i][3]));if(k<=0)continue;const x0=X[i-1],y0=Y(P3[i-1][0]),x1=x0+(X[i]-x0)*k,y1=y0+(Y(P3[i][0])-y0)*k;
  h+=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${P3[i][0]>P3[i-1][0]?'#3ccf6e':'#ff5a5a'}" stroke-width="9" stroke-linecap="round"/>`}
 P3.forEach(([v,l,s,t0],i)=>{const k=eback(P(t,t0,t0+.4));if(k<=0)return;const c=i===0?'#f3ebde':i===1?'#3ccf6e':'#ff5a5a';
  h+=`<g transform="translate(${X[i]} ${Y(v)}) scale(${k})"><circle r="18" fill="${c}"/><text y="${i===2?90:-46}" text-anchor="middle" font-family="Archivo Black" font-size="48" fill="${c}">${s}</text>
  <text y="${i===2?140:-100}" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="40" fill="#bdb3a6">${l}</text></g>`});
 sv.innerHTML=h;};
R.D=(t,d)=>{ap($('Da'),t,.2,.4,30);pop($('D1'),t,2.4,.45,-3,0);pop($('D2'),t,4.6,.45,3,0);ap($('Dd'),t,6.5,.4,10);};
R.H=(t,d)=>{pop($('Ha'),t,.2,.45);pop($('Hb'),t,2.3,.4,-6,-2);};
</script></body></html>
