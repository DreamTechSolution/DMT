<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="durs2.js"></script>
<script>window.ORDER=['I','A','B','C','D','E','F','G','H'];</script>
<script src="hook.js"></script>
<script src="engine.js"></script>
</head><body><div id="stage">

<!-- A · podium + counter + coins -->
<div class="scene" id="A" style="background:#f4f0e8">
 <div class="abs mono" id="Ak" style="top:300px;font-size:28px;letter-spacing:4px;color:#8a7a6c">EXPORT ITALIANO · MERCATI 2025</div>
 <svg id="As" width="1080" height="1060" style="position:absolute;left:0;top:360px"></svg>
</div>

<!-- B · two container stacks -->
<div class="scene" id="B" style="background:#0d1022">
 <div class="abs bold" id="Ba" style="top:290px;font-size:84px;color:#fff">COSA VENDIAMO?</div>
 <svg id="Bs" width="1080" height="1000" style="position:absolute;left:0;top:400px"></svg>
</div>

<!-- C · four smaller stacks + down badges -->
<div class="scene" id="C" style="background:#0d1022">
 <div class="abs mono" id="Ck" style="top:300px;font-size:28px;letter-spacing:4px;color:#8fa3c0">EXPORT ITALIA → USA · 2025 · MLD €</div>
 <svg id="Cs" width="1080" height="1060" style="position:absolute;left:0;top:380px"></svg>
</div>

<!-- D · thermometer -->
<div class="scene" id="D" style="background:#121014">
 <div class="abs mono" id="Dk" style="top:300px;font-size:28px;letter-spacing:4px;color:#bdb3a6">DAZIO MEDIO EFFETTIVO SUI PRODOTTI ITALIANI</div>
 <svg id="Ds" width="1080" height="1060" style="position:absolute;left:0;top:370px"></svg>
</div>

<!-- E · US receipt -->
<div class="scene" id="E" style="background:#f4f0e8">
 <div class="abs bold" id="Ea" style="top:290px;font-size:96px;color:#141215">CHI PAGA?</div>
 <svg id="Es" width="1080" height="1060" style="position:absolute;left:0;top:400px"></svg>
</div>

<!-- F · three-way signpost -->
<div class="scene" id="F" style="background:#071410">
 <div class="abs bold" id="Fa" style="top:290px;font-size:76px;color:#f3ebde">10 GENNAIO</div>
 <div class="abs serif" id="Fb" style="top:375px;font-size:50px;color:#9fc7b4">scenari, non certezze</div>
 <svg id="Fs" width="1080" height="1000" style="position:absolute;left:0;top:450px"></svg>
</div>

<!-- G · 11 March + 15% ceiling -->
<div class="scene" id="G" style="background:#0d1022">
 <svg id="Gs" width="1080" height="1180" style="position:absolute;left:0;top:290px"></svg>
</div>

<!-- H · save + comment as shipping label -->
<div class="scene" id="H" style="background:#121014">
 <svg id="Hs" width="1080" height="420" style="position:absolute;left:0;top:330px"></svg>
 <div class="abs bold" id="Ha" style="top:780px;font-size:112px;color:#fff">SALVA IL VIDEO</div>
 <div class="abs" id="Hc" style="top:950px"><div style="width:860px;background:#f3ebde;border:4px dashed #c94f2a;border-radius:24px;padding:26px 34px;text-align:left">
  <div class="mono" style="font-size:26px;font-weight:700;color:#c94f2a;letter-spacing:3px">COMMENTO · DESTINAZIONE: CLAUDIO</div>
  <div class="sans" id="Ht" style="font-size:44px;font-weight:700;color:#141215;margin-top:10px;min-height:56px"></div></div></div>
 <div class="abs serif" id="Hb" style="top:1170px;font-size:58px;color:#bdb3a6">quale prodotto italiano seguo?</div>
</div>

<div class="grain"></div><div class="vig"></div>
</div>
<script>
// A · podium (1 Germania, 2 USA) -> 69,6 mld counter -> 10 coins, one highlighted
R.A=(t,d)=>{ap($('Ak'),t,.1,.3,10);let h='';
 const p=eo(P(t,.6,1.4));
 h+=`<g transform="translate(0 ${(1-p)*60})" opacity="${p}">
  <rect x="200" y="${260}" width="300" height="160" fill="#26405f"/><text x="350" y="370" text-anchor="middle" font-family="Archivo Black" font-size="110" fill="#f3ebde">1</text>
  <text x="350" y="230" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="34" fill="#26405f">GERMANIA</text>
  <rect x="520" y="${300}" width="300" height="120" fill="#e2683c"/><text x="670" y="395" text-anchor="middle" font-family="Archivo Black" font-size="96" fill="#f3ebde">2</text>
  <text x="670" y="270" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="34" fill="#c94f2a" opacity="${P(t,1.4,1.8)}">STATI UNITI</text></g>`;
 h+=`<line x1="140" y1="420" x2="940" y2="420" stroke="#141215" stroke-width="5"/>`;
 if(t>3.0){const v=69.6*ex(P(t,3.0,5.2));h+=`<text x="540" y="600" text-anchor="middle" font-family="Archivo Black" font-size="128" fill="#141215" opacity="${P(t,3,3.3)}">${fmt(v,1)} MLD €</text>
  <text x="540" y="660" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="46" fill="#5a4a3a" opacity="${P(t,3.6,4)}">di merci vendute negli Stati Uniti nel 2025 (+7,2%)</text>`}
 for(let i=0;i<10;i++){const k=eback(P(t,6.0+i*.07,6.4+i*.07));if(k<=0)continue;const x=135+i*90,hi=i===9&&t>7.2;
  h+=`<g transform="translate(${x} 800) scale(${k*(hi?1.25:1)})"><circle r="38" fill="${hi?'#e2683c':'#d8cfc2'}" stroke="${hi?'#c94f2a':'#b8ab9b'}" stroke-width="5"/><text y="14" text-anchor="middle" font-family="Archivo Black" font-size="38" fill="${hi?'#fff':'#8a7a6c'}">€</text></g>`}
 if(t>7.4)h+=`<text x="540" y="920" text-anchor="middle" font-family="Archivo Black" font-size="56" fill="#c94f2a" opacity="${P(t,7.4,7.8)}">10,8% DI TUTTO L'EXPORT</text>
  <text x="540" y="990" text-anchor="middle" font-family="JetBrains Mono" font-size="22" fill="#8a7a6c" opacity="${P(t,8,8.4)}">Istat · Rapporto ICE 2025-2026</text>`;
 $('As').innerHTML=h;};

// container helper: stack of n boxes
function stack(x,yb,n,w,c,t,t0,lab,val,sub,bh=58){let h='';
 for(let i=0;i<n;i++){const k=eo(P(t,t0+i*.05,t0+i*.05+.3));if(k<=0)continue;const y=yb-(i+1)*(bh+6);
  h+=`<g transform="translate(0 ${(1-k)*-200})" opacity="${k}"><rect x="${x}" y="${y}" width="${w}" height="${bh}" rx="4" fill="${c}"/>
  ${[1,2,3,4,5,6,7].map(j=>`<line x1="${x+j*w/8}" y1="${y+8}" x2="${x+j*w/8}" y2="${y+bh-8}" stroke="rgba(0,0,0,.25)" stroke-width="4"/>`).join('')}</g>`}
 const o=P(t,t0+n*.05+.2,t0+n*.05+.5);const top=yb-n*(bh+6);
 h+=`<g opacity="${o}"><text x="${x+w/2}" y="${top-30}" text-anchor="middle" font-family="Archivo Black" font-size="${w>300?92:62}" fill="#fff">${val}</text>
  <text x="${x+w/2}" y="${yb+50}" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="${w>300?34:28}" fill="#c9d6ea">${lab}</text>
  ${sub?`<text x="${x+w/2}" y="${yb+96}" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="${w>300?40:34}" fill="#8fa3c0">${sub}</text>`:''}</g>`;return h}
R.B=(t,d)=>{ap($('Ba'),t,.1,.4,30);let h=`<line x1="80" y1="760" x2="1000" y2="760" stroke="#3a4a62" stroke-width="5"/>`;
 h+=stack(130,760,10,360,'#e2683c',t,1.6,'FARMACI','15,5','mld € · +55% in un anno',44);
 h+=stack(590,760,9,360,'#5b7fb0',t,7.6,'MACCHINARI','13,3','mld €',44);
 if(t>4.4)h+=`<text x="310" y="910" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="38" fill="#f2c14e" opacity="${P(t,4.4,4.8)}">anche per anticipare i dazi</text>`;
 h+=`<text x="540" y="970" text-anchor="middle" font-family="JetBrains Mono" font-size="22" fill="#5a6478" opacity="${P(t,8.6,9)}">Eurostat Comext · capitoli 30 e 84</text>`;
 $('Bs').innerHTML=h;};
function badge(x,y,txt,t,t0){const k=eback(P(t,t0,t0+.4));if(k<=0)return '';return `<g transform="translate(${x} ${y}) scale(${k})"><rect x="-110" y="-46" width="220" height="92" rx="46" fill="#ff5a5a"/>
 <text y="18" text-anchor="middle" font-family="Archivo Black" font-size="50" fill="#0d1022">↓${txt}</text></g>`}
R.C=(t,d)=>{ap($('Ck'),t,.1,.3,10);let h=`<line x1="60" y1="760" x2="1020" y2="760" stroke="#3a4a62" stroke-width="5"/>`;
 h+=stack(70,760,5,210,'#3ccf6e',t,.3,'CIBO+BEVANDE','7,5','');
 h+=stack(310,760,4,210,'#b07cc6',t,1.9,'MODA','5,6','');
 h+=stack(550,760,2,210,'#c62828',t,3.6,'VINO','1,75','');
 h+=stack(790,760,3,210,'#8fa3c0',t,5.6,'AUTO','2,7','');
 h+=badge(655,780-2*64-170,'10%',t,4.6)+badge(895,780-3*64-170,'21%',t,6.8);
 h+=`<text x="540" y="900" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="40" fill="#8fa3c0" opacity="${P(t,7,7.4)}">variazioni rispetto al 2024</text>
  <text x="540" y="960" text-anchor="middle" font-family="JetBrains Mono" font-size="22" fill="#5a6478" opacity="${P(t,7,7.4)}">Eurostat Comext · moda = tessile, abbigliamento, calzature, pelletteria</text>`;
 $('Cs').innerHTML=h;};

// D · thermometer 2,3 -> 11
R.D=(t,d)=>{ap($('Dk'),t,.1,.3,10);const Yv=v=>840-v*52;const k=eio(P(t,5.0,6.6));const v=t<3.4?0:2.3+(11-2.3)*k;const g=P(t,3.4,3.9);
 let h=`<rect x="440" y="${Yv(13)-30}" width="120" height="${Yv(0)-Yv(13)+60}" rx="60" fill="#2a2426"/><circle cx="500" cy="910" r="100" fill="#2a2426"/>
  <circle cx="500" cy="910" r="78" fill="#e2683c"/><rect x="470" y="${Yv(v*g)}" width="60" height="${910-Yv(v*g)}" fill="#e2683c"/>`;
 for(let i=0;i<=12;i+=2)h+=`<line x1="580" y1="${Yv(i)}" x2="610" y2="${Yv(i)}" stroke="#5a5054" stroke-width="4"/><text x="625" y="${Yv(i)+10}" font-family="JetBrains Mono" font-size="26" fill="#6b6266">${i}%</text>`;
 if(t>3.5)h+=`<g opacity="${P(t,3.5,3.9)}"><line x1="300" y1="${Yv(2.3)}" x2="440" y2="${Yv(2.3)}" stroke="#bdb3a6" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="290" y="${Yv(2.3)+4}" text-anchor="end" font-family="Archivo Black" font-size="64" fill="#bdb3a6">2,3%</text><text x="290" y="${Yv(2.3)+50}" text-anchor="end" font-family="Instrument Serif" font-style="italic" font-size="38" fill="#8a8590">fine 2024</text></g>`;
 if(t>6.4)h+=`<g opacity="${P(t,6.4,6.8)}"><line x1="300" y1="${Yv(11)}" x2="440" y2="${Yv(11)}" stroke="#e2683c" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="290" y="${Yv(11)+20}" text-anchor="end" font-family="Archivo Black" font-size="110" fill="#e2683c">11%</text><text x="290" y="${Yv(11)+70}" text-anchor="end" font-family="Instrument Serif" font-style="italic" font-size="38" fill="#e9e1d6">fine 2025</text></g>`;
 h+=`<text x="540" y="1060" text-anchor="middle" font-family="JetBrains Mono" font-size="22" fill="#6b6266" opacity="${P(t,7,7.4)}">Rapporto ICE 2025-2026 · Agenzia ICE</text>`;
 $('Ds').innerHTML=h;};

// E · receipt with tariff line + 96% + two risk chips
R.E=(t,d)=>{pop($('Ea'),t,.1,.4,-3,0);let h='';const k=eo(P(t,1.2,2.0));const hgt=560*k;
 h+=`<g><rect x="260" y="0" width="560" height="${hgt}" fill="#fff" stroke="#d8cfc2" stroke-width="2"/>`;
 if(k>=1){h+=`<path d="${Array.from({length:15},(_,i)=>`${i?'L':'M'}${260+i*40} 560 L${280+i*40} 580`).join(' ')} L820 560 Z" fill="#fff"/>
  <text x="540" y="70" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="34" fill="#141215">NEGOZIO · USA</text>
  <line x1="300" y1="100" x2="780" y2="100" stroke="#141215" stroke-dasharray="6 6" stroke-width="3"/>
  <text x="300" y="170" font-family="JetBrains Mono" font-size="34" fill="#141215">prodotto italiano</text><text x="780" y="170" text-anchor="end" font-family="JetBrains Mono" font-size="34" fill="#141215">100</text>`;
  if(t>2.6)h+=`<g opacity="${P(t,2.6,3)}"><text x="300" y="240" font-family="JetBrains Mono" font-weight="700" font-size="34" fill="#c94f2a">+ costo del dazio</text><text x="780" y="240" text-anchor="end" font-family="JetBrains Mono" font-weight="700" font-size="34" fill="#c94f2a">≈96%</text></g>`;
  if(t>4.4)h+=`<g opacity="${P(t,4.4,4.8)}"><line x1="300" y1="290" x2="780" y2="290" stroke="#141215" stroke-dasharray="6 6" stroke-width="3"/>
   <text x="540" y="400" text-anchor="middle" font-family="Archivo Black" font-size="104" fill="#c94f2a">96%</text>
   <text x="540" y="460" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="40" fill="#5a4a3a">finisce sui prezzi americani</text>
   <text x="540" y="520" text-anchor="middle" font-family="JetBrains Mono" font-size="20" fill="#8a7a6c">studi citati dal Rapporto ICE</text></g>`}
 h+=`</g>`;
 [['vendere meno',190,7.0],['guadagnare meno',670,8.8]].forEach(([s,x,t0])=>{const c=eback(P(t,t0,t0+.4));if(c<=0)return;
  h+=`<g transform="translate(${x+110} 720) scale(${c})"><rect x="-210" y="-64" width="420" height="128" rx="20" fill="#141215"/><text y="-10" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="22" fill="#f2c14e">RISCHIO PER CHI ESPORTA</text>
  <text y="38" text-anchor="middle" font-family="Archivo Black" font-size="32" fill="#fff">${s.toUpperCase()}</text></g>`});
 $('Es').innerHTML=h;};

// F · signpost with three arrows
const SC=[['1','PROROGA','la tregua continua','#9fc7b4',-1,3.6],['2','ROTTURA','tornano i limiti sulle terre rare','#ff5a5a',0,5.4],['3','ACCORDO','più ampio','#f2c14e',1,11.6]];
R.F=(t,d)=>{pop($('Fa'),t,.1,.4);ap($('Fb'),t,1.6,.4,20);let h=`<rect x="525" y="80" width="30" height="900" fill="#4a3a2a"/>`;
 SC.forEach(([n,a,b,c,dir,t0],i)=>{const k=eback(P(t,t0,t0+.45));if(k<=0)return;const y=120+i*250;const L=dir<0;const x=L?540:540;
  const pts=L?`M560 ${y} H120 L60 ${y+80} L120 ${y+160} H560 Z`:`M520 ${y} H960 L1020 ${y+80} L960 ${y+160} H520 Z`;
  const tx=L?320:760;
  h+=`<g transform="translate(540 ${y+80}) scale(${k}) translate(-540 ${-(y+80)})"><path d="${pts}" fill="${c}"/>
   <text x="${tx}" y="${y+70}" text-anchor="middle" font-family="Archivo Black" font-size="58" fill="#071410">${n} · ${a}</text>
   <text x="${tx}" y="${y+120}" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="${b.length>22?30:40}" fill="#071410">${b}</text></g>`});
 if(t>7.5)h+=`<text x="540" y="${120+2*250-40}" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="26" fill="#9fc7b4" opacity="${P(t,7.5,7.9)}">servono anche all'industria europea (motori, elettronica)</text>`;
 $('Fs').innerHTML=h;};

// G · calendar 11 MAR + shield 15%
R.G=(t,d)=>{let h='';const c=eback(P(t,1.0,1.4));
 if(c>0)h+=`<g transform="translate(250 230) scale(${c})"><rect x="-150" y="-170" width="300" height="340" rx="24" fill="#f3ebde"/><rect x="-150" y="-170" width="300" height="90" rx="24" fill="#5b7fb0"/><rect x="-150" y="-110" width="300" height="30" fill="#5b7fb0"/>
  <text y="-105" text-anchor="middle" font-family="Archivo Black" font-size="48" fill="#f3ebde">MARZO</text><text y="90" text-anchor="middle" font-family="Archivo Black" font-size="170" fill="#0d1022">11</text>
  <text y="145" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="26" fill="#8a7a6c">2027 · ENTRO</text></g>`;
 if(t>2.2)h+=`<g opacity="${P(t,2.2,2.6)}"><text x="440" y="150" font-family="Archivo Black" font-size="46" fill="#fff">INDAGINE USA</text>
  <text x="440" y="205" font-family="Instrument Serif" font-style="italic" font-size="40" fill="#c9d6ea">sulla "sovraccapacità"</text>
  <text x="440" y="260" font-family="JetBrains Mono" font-weight="700" font-size="26" fill="#8fa3c0">16 ECONOMIE, ANCHE UE E CINA</text>
  <text x="440" y="320" font-family="Archivo Black" font-size="40" fill="#ff5a5a" opacity="${P(t,4.0,4.4)}">→ POSSIBILI NUOVI DAZI</text></g>`;
 const s=eback(P(t,6.6,7.1));
 if(s>0)h+=`<g transform="translate(540 760) scale(${s})"><path d="M0 -260 L230 -180 V20 C230 160 120 240 0 290 C-120 240 -230 160 -230 20 V-180 Z" fill="#e2683c"/>
  <text y="-90" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="32" fill="#0d1022">ACCORDO UE-USA</text>
  <text y="50" text-anchor="middle" font-family="Archivo Black" font-size="150" fill="#0d1022">15%</text>
  <text y="120" text-anchor="middle" font-family="Archivo Black" font-size="44" fill="#0d1022">TETTO</text></g>`;
 if(t>9.2)h+=`<text x="540" y="1130" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="44" fill="#f3ebde" opacity="${P(t,9.2,9.6)}">se superato, l'Europa può sospendere le sue concessioni</text>`;
 $('Gs').innerHTML=h;};

// H · ribbon bookmark tied on a parcel
R.H=(t,d)=>{let h='';const k=eback(P(t,.05,.45));
 h+=`<g transform="translate(540 210) scale(${k})"><rect x="-200" y="-150" width="400" height="300" rx="16" fill="#b07a4a"/><rect x="-200" y="-150" width="400" height="300" rx="16" fill="none" stroke="#8a5a2b" stroke-width="6"/>
  <rect x="-22" y="-150" width="44" height="300" fill="#e2683c"/><rect x="-200" y="-22" width="400" height="44" fill="#e2683c"/>
  <path d="M0 -150 C-80 -230 -150 -170 -60 -150 Z M0 -150 C80 -230 150 -170 60 -150 Z" fill="#e2683c"/>
  <text y="100" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="28" fill="#3a2412">MADE IN ITALY</text></g>`;
 $('Hs').innerHTML=h;pop($('Ha'),t,.3,.4);ap($('Hc'),t,1.0,.4,40);typeT($('Ht'),'il parmigiano…',t,1.3,10);words($('Hb'),t,2.0);};
</script></body></html>
