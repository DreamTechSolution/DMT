<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#121014}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#221a1a 0%,#121014 65%)}
.abs{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center}
.bold{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-3px;line-height:.95}
.serif{font-family:'Instrument Serif',serif;font-style:italic}
.mono{font-family:'JetBrains Mono',monospace;font-weight:700}
/* safe area guide (not rendered): grid crop ~ y 240..1680 */
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
</style></head><body><div id="c">
 <div class="abs mono" id="tag" style="top:420px;font-size:30px;letter-spacing:5px;color:#f3ebde;background:#e2683c;padding:12px 28px;border-radius:40px"></div>
 <div class="abs bold" id="t1" style="top:540px;font-size:128px;color:#fff"></div>
 <div class="abs bold" id="t2" style="top:680px;font-size:112px;color:#e2683c"></div>
 <svg id="viz" width="1080" height="420" style="position:absolute;left:0;top:860px"></svg>
 <div class="abs serif" style="top:1330px;font-size:60px;color:#bdb3a6">te lo spiega <span style="color:#e2683c;font-size:76px">Claudio</span></div>
 <div class="grain"></div>
</div>
<script>
const V={
 p1:{tag:'PARTE 1 DI 2',t1:'BTP QUASI<br>AL 4,5%',t2b:'PERCHÉ RENDE COSÌ TANTO',viz:'board'},
 p2:{tag:'PARTE 2 DI 2',t1:'BTP O CONTO<br>DEPOSITO?',t2b:'IL CONFRONTO, CONTI ALLA MANO',viz:'rcpt'}
};
const v=V[new URLSearchParams(location.search).get('v')||'p2'];
tag.textContent=v.tag;t1.innerHTML=v.t1;
t1.style.top='500px';t1.style.fontSize='108px';t2.style.top='770px';t2.style.fontSize=v.t2b.length>26?'48px':'56px';t2.style.letterSpacing='-1px';t2.style.color='#f2c14e';t2.textContent=v.t2b;
document.getElementById('c').style.background='radial-gradient(ellipse at 50% 45%,#16253c 0%,#0a1424 65%)';
document.getElementById('tag').style.background='#26405f';
let h='';
if(v.viz==='board'){
 [...'4,47%'].forEach((c,i)=>{const w=c===','?70:c==='%'?150:118;const x=[200,325,402,527,652][i];h+=`<rect x="${x}" y="80" width="${w}" height="190" rx="14" fill="#1b2536"/><text x="${x+w/2}" y="235" text-anchor="middle" font-family="Archivo Black" font-size="140" fill="#f3ebde">${c}</text><line x1="${x}" y1="175" x2="${x+w}" y2="175" stroke="#0a1424" stroke-width="4"/>`});
 h+=`<text x="540" y="350" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="34" fill="#8fa3c0">BTP 10 ANNI · 19/11/2026</text>`;
}else{
 [['BTP','330 €','#3ccf6e',300],['CONTO DEP.','276 €','#ff5a5a',780]].forEach(([n,v2,c,x])=>{h+=`<rect x="${x-200}" y="40" width="400" height="300" rx="14" fill="#fffdf7"/><text x="${x}" y="120" text-anchor="middle" font-family="Archivo Black" font-size="48" fill="#141215">${n}</text><text x="${x}" y="200" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="30" fill="#8a7a6c">NETTO</text><text x="${x}" y="290" text-anchor="middle" font-family="Archivo Black" font-size="88" fill="${c==='#3ccf6e'?'#1f8a4c':'#c94f2a'}">${v2}</text>`});
 h+=`<text x="540" y="400" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="28" fill="#8fa3c0">10.000 € · 1 anno · 4% lordo · tassi di esempio</text>`;
}
viz.innerHTML=h;
window.ready=document.fonts.ready.then(()=>true);
</script></body></html>
